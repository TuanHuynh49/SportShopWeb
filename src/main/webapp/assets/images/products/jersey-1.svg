    <path d="M90 30 L40 65 L60 110 L90 95 L90 220 L190 220 L190 95 L220 110 L240 65 L190 30 C165 45 115 45 90 30 Z" fill="url(#jerseyGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Collar -->
