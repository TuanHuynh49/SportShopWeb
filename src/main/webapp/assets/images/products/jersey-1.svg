    <line x1="90" y1="35" x2="45" y2="70" stroke="#0f172a" stroke-width="4"/>
    <line x1="190" y1="35" x2="235" y2="70" stroke="#0f172a" stroke-width="4"/>
    <!-- Sponsor & Crest Emblem -->
    <rect x="110" y="75" width="22" height="22" rx="4" fill="#0f172a"/>
    <polygon points="121,78 126,88 116,88" fill="#d97706"/>
    <text x="140" y="145" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="1">FLY BETTER</text>
  </g>
  <text x="200" y="345" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="2">REAL MADRID HOME 2026</text>
</svg>
