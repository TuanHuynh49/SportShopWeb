<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8fafc"/>
  <defs>
    <radialGradient id="ballShade" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
  </defs>
  <!-- Ball Sphere -->
  <circle cx="200" cy="190" r="95" fill="url(#ballShade)" stroke="#94a3b8" stroke-width="2"/>
  <!-- Champions League Star Patterns -->
  <g fill="#0f172a" stroke="#2563eb" stroke-width="1.5">
    <!-- Star 1 (Center) -->
    <polygon points="200,140 208,165 235,165 213,180 221,205 200,190 179,205 187,180 165,165 192,165"/>
    <!-- Star 2 (Top Left) -->
    <polygon points="140,110 148,130 170,130 152,143 158,162 140,150 122,162 128,143 110,130 132,130" opacity="0.8"/>
    <!-- Star 3 (Right) -->
    <polygon points="260,130 266,148 285,148 270,160 275,178 260,166 245,178 250,160 235,148 254,148" opacity="0.8"/>
    <!-- Star 4 (Bottom) -->
    <polygon points="180,215 186,230 202,230 190,240 194,255 180,245 166,255 170,240 158,230 174,230" opacity="0.8"/>
  </g>
  <!-- Drop Shadow -->
  <ellipse cx="200" cy="300" rx="80" ry="12" fill="#000000" opacity="0.08"/>
  <text x="200" y="345" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="2">ADIDAS UCL PRO BALL</text>
</svg>
