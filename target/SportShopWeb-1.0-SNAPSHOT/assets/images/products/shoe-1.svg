<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8fafc"/>
  <defs>
    <linearGradient id="shoeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Background Aura -->
  <circle cx="200" cy="200" r="130" fill="#eff6ff" opacity="0.8"/>
  <!-- Modern Athletic Cleat Vector Silhouette -->
  <g transform="translate(45, 90)">
    <!-- Sole & Studs -->
    <path d="M40 180 Q150 190 270 170 Q285 165 290 155 Q285 145 250 148 Q150 155 50 148 Q35 155 40 180 Z" fill="#0f172a"/>
    <!-- Studs -->
    <polygon points="60,180 55,195 70,195 75,180" fill="#2563eb"/>
    <polygon points="100,182 95,198 110,198 115,182" fill="#2563eb"/>
    <polygon points="150,183 145,198 160,198 165,183" fill="#2563eb"/>
    <polygon points="210,180 205,196 220,196 225,180" fill="#2563eb"/>
    <polygon points="255,173 250,190 265,190 270,173" fill="#2563eb"/>
    <!-- Shoe Upper Body -->
    <path d="M45 155 C35 125 70 85 110 75 C145 68 180 85 210 115 C240 120 280 135 290 155 C270 168 170 172 45 155 Z" fill="url(#shoeGrad1)"/>
    <!-- Dynamic Speed Lines / Accent Swoosh -->
    <path d="M70 125 Q140 70 245 130 Q170 115 90 145 Z" fill="url(#accentGlow)"/>
    <path d="M90 110 Q145 75 220 120" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Collar (Sock-fit) -->
    <path d="M95 78 C90 55 120 45 135 60 C145 70 155 80 160 85 Z" fill="#1e293b"/>
  </g>
  <text x="200" y="345" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="2">NIKE MERCURIAL PRO</text>
</svg>
